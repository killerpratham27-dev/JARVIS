<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#000000" />
<title>JARVIS</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="debug" style="position:fixed;top:0;left:0;right:0;background:#000;color:#0f0;font-family:monospace;font-size:10px;padding:6px;z-index:99999;max-height:120px;overflow-y:auto;border-bottom:1px solid #0f0;"></div>

<div id="bootScreen">
  <div class="boot-line">Initializing core...</div>
  <div class="boot-line">Loading neural interface...</div>
  <div class="boot-line">Calibrating audio sensors...</div>
  <div class="boot-line">Establishing memory banks...</div>
  <div class="boot-line glow">JARVIS ONLINE</div>
</div>

<div id="app" class="hidden">
  <header class="header" style="margin-top:130px;">
    <div class="title">&#9679; J A R V I S</div>
    <div class="status-row">
      <span id="statusDot" class="dot"></span>
      <span id="statusText">INITIALIZING</span>
    </div>
  </header>

  <div id="infoPanel" class="info-panel hidden">
    <img id="infoImage" class="info-image" alt="" />
    <div id="infoTitle" class="info-title"></div>
    <div id="infoText" class="info-text"></div>
  </div>

  <div id="chatArea" class="chat-area"></div>

  <div style="display:flex;gap:6px;padding:8px 0;">
    <input id="textInput" type="text" placeholder="Type here..." style="flex:1;padding:10px;background:#000810;color:#fff;border:1px solid #00e5ff;border-radius:8px;font-size:14px;" />
    <button id="sendBtn" style="padding:10px 16px;background:#00e5ff;color:#000;border:none;border-radius:8px;font-weight:700;">SEND</button>
  </div>

  <div class="waveform" id="waveform">
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span>
  </div>

  <button id="settingsBtn" class="gear">&#9881;</button>

  <div id="settingsModal" class="modal hidden">
    <div class="modal-box">
      <h2>SETUP</h2>
      <label>Groq API Key</label>
      <input id="apiKeyInput" type="password" placeholder="gsk_..." />
      <label>Your Name</label>
      <input id="nameInput" type="text" value="Pratham" />
      <div class="modal-actions">
        <button id="saveSettings">SAVE</button>
        <button id="closeSettings">CLOSE</button>
      </div>
      <button id="clearMemory" class="danger">CLEAR MEMORY</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
